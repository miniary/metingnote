<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 정리기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#e3e3e0; --accent:#2f6fed; --accent-soft:#e8efff; --danger:#d93036; --rec:#e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1d1d20; --fg:#ececee; --muted:#9a9aa0; --line:#2e2e33; --accent:#5b8cff; --accent-soft:#1f2a44; --danger:#ff6369; --rec:#ff6369; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  .layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:16px; background:var(--card); }
  aside h2 { font-size:13px; color:var(--muted); font-weight:600; margin:20px 0 8px; }
  #noteList { list-style:none; margin:0; padding:0; }
  #noteList li { padding:8px 10px; border-radius:8px; cursor:pointer; }
  #noteList li:hover { background:var(--bg); }
  #noteList li.active { background:var(--accent-soft); }
  #noteList .t { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #noteList .d { font-size:12px; color:var(--muted); }
  #noteList .empty { color:var(--muted); font-size:14px; cursor:default; }
  main { padding:24px; max-width:900px; width:100%; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .spread { justify-content:space-between; }
  button, label.btn { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.rec { background:var(--rec); border-color:var(--rec); color:#fff; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  aside > button { width:100%; }
  #status { color:var(--muted); font-size:14px; }
  #status.err { color:var(--danger); }
  audio { width:100%; margin-top:12px; }
  h3 { font-size:15px; margin:0 0 8px; }
  textarea { width:100%; min-height:200px; resize:vertical; background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font-family:inherit; font-size:14px; line-height:1.6; }
  #title { width:100%; font-family:inherit; font-size:20px; font-weight:600; line-height:1.4; color:var(--fg); background:transparent; border:1px solid transparent; border-radius:8px; padding:4px 6px; margin:-4px -6px 8px; }
  #title:hover, #title:focus { border-color:var(--line); outline:none; }
  .section { margin-top:16px; }
  .section p { margin:0; white-space:pre-wrap; }
  .section ul { margin:0; padding-left:20px; }
  .meta { color:var(--muted); font-size:13px; }
  .none { color:var(--muted); }
  details summary { cursor:pointer; color:var(--muted); font-size:14px; }
  input[type=file] { display:none; }
  [hidden] { display:none !important; }
  @media (max-width:720px) {
    .layout { grid-template-columns:1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    main { padding:16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <button id="newBtn" class="primary">+ 새 회의록</button>
    <h2>저장된 회의록</h2>
    <ul id="noteList"></ul>
  </aside>

  <main>
    <h1>회의록 정리기</h1>

    <section class="card" id="inputCard">
      <div class="row">
        <label class="btn">녹취 파일 올리기<input id="fileInput" type="file" accept="audio/*,video/*"></label>
        <button id="recBtn">● 직접 녹음</button>
        <button id="transcribeBtn" class="primary" disabled>받아쓰기</button>
        <span id="status"></span>
      </div>
      <audio id="player" controls hidden></audio>
    </section>

    <section class="card" id="transcriptCard" hidden>
      <div class="row spread">
        <h3>받아쓰기</h3>
        <button id="summarizeBtn" class="primary" disabled>회의록 정리</button>
      </div>
      <textarea id="transcript" placeholder="받아쓰기 결과가 여기에 표시됩니다. 직접 고친 뒤 정리할 수 있어요."></textarea>
    </section>

    <section class="card" id="resultCard" hidden>
      <input id="title" aria-label="회의 제목">
      <div class="meta" id="meta"></div>

      <div class="section">
        <h3>요약</h3>
        <p id="summary"></p>
      </div>
      <div class="section">
        <h3>결정 사항</h3>
        <ul id="decisions"></ul>
      </div>
      <div class="section">
        <h3>할 일</h3>
        <ul id="actions"></ul>
      </div>
      <details class="section" id="savedTranscript" hidden>
        <summary>받아쓰기 원문 보기</summary>
        <p id="savedTranscriptText"></p>
      </details>

      <div class="row section">
        <button id="saveBtn" class="primary">저장</button>
        <button id="exportBtn">.md 내보내기</button>
        <button id="deleteBtn" class="danger" hidden>삭제</button>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let audioBlob = null, recorder, chunks = [], timer;
// 현재 화면의 회의록: { id?, title, summary, decisions, actionItems, transcript, fileName, createdAt? }
let current = null;

function setStatus(text, isError = false) {
  $('status').textContent = text;
  $('status').className = isError ? 'err' : '';
}

async function api(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

const fmtDate = (iso) => new Date(iso).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });

// ---------- 저장된 회의록 목록 ----------

async function loadList() {
  const notes = await api('/api/notes');
  const list = $('noteList');
  list.innerHTML = '';
  if (!notes.length) {
    list.innerHTML = '<li class="empty">아직 저장된 회의록이 없어요</li>';
    return;
  }
  for (const n of notes) {
    const li = document.createElement('li');
    li.dataset.id = n.id;
    li.className = current?.id === n.id ? 'active' : '';
    li.innerHTML = '<span class="t"></span><span class="d"></span>';
    li.querySelector('.t').textContent = n.title;
    li.querySelector('.d').textContent = fmtDate(n.createdAt);
    li.onclick = () => openNote(n.id);
    list.appendChild(li);
  }
}

async function openNote(id) {
  try {
    const note = await api('/api/notes/' + id);
    resetInput();
    $('inputCard').hidden = true;
    $('transcriptCard').hidden = true;
    showResult(note);
    loadList();
  } catch (e) {
    alert(e.message);
    loadList();
  }
}

// ---------- 결과 표시 ----------

function showResult(note) {
  current = note;
  $('resultCard').hidden = false;
  $('title').value = note.title || '';
  $('meta').textContent = note.id
    ? `저장됨 · ${fmtDate(note.createdAt)}${note.fileName ? ' · ' + note.fileName : ''}`
    : '아직 저장하지 않았어요';
  $('summary').textContent = note.summary || '없음';

  const fill = (ul, items, render) => {
    ul.innerHTML = '';
    if (!items.length) { ul.innerHTML = '<li class="none">없음</li>'; return; }
    for (const it of items) { const li = document.createElement('li'); li.textContent = render(it); ul.appendChild(li); }
  };
  fill($('decisions'), note.decisions || [], (d) => d);
  fill($('actions'), note.actionItems || [], (a) => {
    const extra = [a.owner && `담당: ${a.owner}`, a.due && `기한: ${a.due}`].filter(Boolean).join(', ');
    return extra ? `${a.task} (${extra})` : a.task;
  });

  // 저장된 회의록을 볼 때는 원문을 접어서 보여줌
  $('savedTranscript').hidden = !note.id;
  $('savedTranscript').open = false;
  $('savedTranscriptText').textContent = note.transcript || '';

  $('saveBtn').textContent = note.id ? '제목 변경 저장' : '저장';
  $('saveBtn').disabled = false;
  $('deleteBtn').hidden = !note.id;
}

// ---------- 입력 (파일 / 녹음) ----------

function resetInput() {
  audioBlob = null;
  $('fileInput').value = '';
  $('player').hidden = true;
  $('player').removeAttribute('src');
  $('transcribeBtn').disabled = true;
  $('transcript').value = '';
  $('summarizeBtn').disabled = true;
  setStatus('');
}

function startNew() {
  current = null;
  resetInput();
  $('inputCard').hidden = false;
  $('transcriptCard').hidden = true;
  $('resultCard').hidden = true;
  loadList();
}

function setAudio(blob) {
  audioBlob = blob;
  $('player').src = URL.createObjectURL(blob);
  $('player').hidden = false;
  $('transcribeBtn').disabled = false;
}

$('fileInput').onchange = (e) => {
  const f = e.target.files[0];
  if (f) { setAudio(f); setStatus(f.name); }
};

$('recBtn').onclick = async () => {
  if (recorder?.state === 'recording') { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(timer);
      setAudio(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
      $('recBtn').textContent = '● 직접 녹음';
      $('recBtn').className = '';
      setStatus('녹음 완료');
    };
    recorder.start(1000);
    const startedAt = Date.now();
    $('recBtn').textContent = '■ 녹음 중지';
    $('recBtn').className = 'rec';
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      setStatus(`녹음 중 ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`);
    }, 500);
  } catch {
    setStatus('마이크 권한이 필요합니다.', true);
  }
};

// ---------- 받아쓰기 · 정리 ----------

$('transcribeBtn').onclick = async () => {
  if (!audioBlob) return;
  const fd = new FormData();
  const name = audioBlob.name || 'recording.' + ((audioBlob.type.split('/')[1] || 'webm').split(';')[0]);
  fd.append('audio', audioBlob, name);
  $('transcribeBtn').disabled = true;
  setStatus('받아쓰는 중… 실패하면 잠시 기다렸다 자동으로 다시 시도해요');
  try {
    const { transcript } = await api('/api/transcribe', { method: 'POST', body: fd });
    $('transcript').value = transcript;
    $('transcriptCard').hidden = false;
    $('summarizeBtn').disabled = false;
    setStatus('받아쓰기 완료');
  } catch (e) {
    setStatus('받아쓰기 실패: ' + e.message, true);
  } finally {
    $('transcribeBtn').disabled = false;
  }
};

$('transcript').oninput = () => ($('summarizeBtn').disabled = !$('transcript').value.trim());

$('summarizeBtn').onclick = async () => {
  $('summarizeBtn').disabled = true;
  setStatus('회의록 정리 중…');
  try {
    const result = await api('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: $('transcript').value }),
    });
    showResult({ ...result, transcript: $('transcript').value, fileName: audioBlob?.name || '' });
    setStatus('정리 완료 — 저장 버튼을 눌러 보관하세요');
  } catch (e) {
    setStatus('정리 실패: ' + e.message, true);
  } finally {
    $('summarizeBtn').disabled = false;
  }
};

// ---------- 저장 · 삭제 · 내보내기 ----------

$('saveBtn').onclick = async () => {
  if (!current) return;
  const body = JSON.stringify({ ...current, title: $('title').value });
  $('saveBtn').disabled = true;
  try {
    const saved = current.id
      ? await api('/api/notes/' + current.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body })
      : await api('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    $('inputCard').hidden = true;
    $('transcriptCard').hidden = true;
    resetInput();
    showResult(saved);
    await loadList();
  } catch (e) {
    alert('저장 실패: ' + e.message);
    $('saveBtn').disabled = false;
  }
};

$('deleteBtn').onclick = async () => {
  if (!current?.id) return;
  if (!confirm(`"${current.title}" 회의록을 삭제할까요? 되돌릴 수 없어요.`)) return;
  try {
    await api('/api/notes/' + current.id, { method: 'DELETE' });
    startNew();
  } catch (e) {
    alert('삭제 실패: ' + e.message);
  }
};

$('exportBtn').onclick = () => {
  if (!current) return;
  const n = { ...current, title: $('title').value };
  const list = (arr, f) => (arr.length ? arr.map((x) => '- ' + f(x)).join('\n') : '없음');
  const md = [
    `# ${n.title}`,
    '',
    '## 요약',
    n.summary || '없음',
    '',
    '## 결정 사항',
    list(n.decisions || [], (d) => d),
    '',
    '## 할 일',
    list(n.actionItems || [], (a) => `[ ] ${a.task}${a.owner ? ` — ${a.owner}` : ''}${a.due ? ` (기한: ${a.due})` : ''}`),
    '',
    '---',
    '',
    '## 받아쓰기 원문',
    n.transcript || '',
    '',
  ].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
  a.download = `${n.title.replace(/[\\/:*?"<>|]/g, '_')}.md`;
  a.click();
};

$('newBtn').onclick = startNew;
loadList();
</script>
</body>
</html>
